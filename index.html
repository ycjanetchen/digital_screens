<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What should I read during my commute?</title>
<style>
  :root{
    --paper:#FBFAF7; --page:#EAE6DE; --ink:#1E1C19; --muted:#6F6A61; --soft:#F2EFE9;
    --line:#E4DFD5; --accent:#2C6E63; --accent-soft:#E6F0EE; --mark:#F6E2A0; --rose:#C7485C;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:"Iowan Old Style",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--page);font-family:var(--sans);color:var(--ink);
       min-height:100vh;display:flex;flex-direction:column;align-items:center;
       justify-content:center;gap:12px;padding:20px 12px}
  .phone{height:max(600px,min(736px,calc(100vh - 76px)));aspect-ratio:9/16;background:var(--paper);
         border-radius:38px;box-shadow:0 2px 4px rgba(0,0,0,.08),0 18px 50px rgba(0,0,0,.18);
         position:relative;overflow:hidden}
  .cap{font-size:12px;color:#7a756b;letter-spacing:.04em}
  .cap b{color:#3f3b35;font-weight:600}
  @media (max-width:460px){
    body{padding:0;gap:0;justify-content:flex-start}
    .phone{width:100vw;height:100vh;height:100dvh;aspect-ratio:auto;border-radius:0;box-shadow:none}
    .cap{display:none}
  }

  .screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper)}
  @media (prefers-reduced-motion:no-preference){
    .screen.enter .body,.screen.enter .rfoot{animation:in .2s ease-out}
    .sheet{animation:up .22s ease-out}
    .toast{animation:in .18s ease-out}
  }
  @keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  [role=button]:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  .status{flex:0 0 40px;display:flex;align-items:center;justify-content:space-between;
          padding:0 24px;font-size:12px;font-weight:600}
  .status svg{height:11px;width:auto;fill:var(--ink);margin-left:5px}
  .body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
  .body::-webkit-scrollbar{width:0}

  .nav{flex:0 0 46px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line)}
  .back{font-size:14px;color:var(--accent);cursor:pointer;white-space:nowrap;min-width:58px;padding:8px 0}
  .nav h2{font-size:15px;font-weight:600;flex:1;text-align:center;padding-right:58px;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .tabs{flex:0 0 60px;display:flex;border-top:1px solid var(--line);background:#F6F4EF}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:3px;font-size:10px;color:var(--muted);cursor:pointer}
  .tab.sel{color:var(--accent);font-weight:600}
  .tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;
           stroke-linecap:round;stroke-linejoin:round}
  .tab.sel svg{stroke-width:2}

  /* covers: a spine, a title with a rule under it, the author at the foot */
  .cover{position:relative;aspect-ratio:2/3;border-radius:2px 5px 5px 2px;overflow:hidden;
         padding:10px 8px 8px 13px;display:flex;flex-direction:column;justify-content:space-between;
         color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22)}
  .cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:rgba(0,0,0,.2)}
  .cover .ct{font-family:var(--serif);font-size:11px;line-height:1.22;padding-bottom:6px;
             border-bottom:1px solid rgba(255,255,255,.4)}
  .cover .ca{font-size:6.5px;letter-spacing:.07em;text-transform:uppercase;opacity:.85;line-height:1.3}
  .cover.s{padding:6px 5px 5px 9px}
  .cover.s::before{width:3.5px}
  .cover.s .ct{font-size:7.2px;line-height:1.18;border:0;padding:0}

  .pad{padding:8px 20px 2px}
  .hd{font-family:var(--serif);font-size:20px;letter-spacing:.16em}
  .hq{font-family:var(--serif);font-size:15.5px;margin-top:6px;line-height:1.35}

  .search{display:flex;align-items:center;gap:8px;background:#F0EDE6;border:1px solid var(--line);
          border-radius:12px;padding:9px 12px;margin:10px 20px 0;cursor:text}
  .search svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.8;flex:0 0 auto}
  .search input{border:0;background:transparent;outline:none;font:inherit;font-size:14px;
                width:100%;color:var(--ink)}
  .search input::placeholder{color:#9b958a}
  .clear{font-size:12px;color:var(--muted);cursor:pointer;padding:2px 4px}

  .lbl{padding:16px 20px 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

  .cont{margin:0 20px;padding:11px 13px;border:1px solid var(--line);border-radius:14px;background:#fff;
        display:flex;gap:13px;align-items:center;cursor:pointer}
  .cont:active,.hrow:active,.mcard:active,.srow:active{background:#F3F0EA}
  .cont .cover{width:52px;flex:0 0 52px}
  .cont .t{font-family:var(--serif);font-size:16px;line-height:1.25}
  .cont .a{font-size:12px;color:var(--muted);margin-top:2px}
  .bar{height:4px;border-radius:2px;background:#E7E2D8;overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
  .cont .d{font-size:11px;color:var(--muted);margin-top:6px}

  .hrow{display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--line);cursor:pointer}
  .hrow .tx{flex:1}
  .hrow .t{font-size:15px;font-weight:500}
  .hrow .d{font-size:12px;color:var(--muted);margin-top:2px}
  .chev{width:7px;height:7px;border-right:1.6px solid #b6b0a4;border-top:1.6px solid #b6b0a4;
        transform:rotate(45deg);flex:0 0 auto}
  .mini{position:relative;width:50px;height:44px;flex:0 0 50px}
  .mini i{position:absolute;bottom:2px;width:21px;height:31px;border-radius:1px 3px 3px 1px;
          box-shadow:0 1px 3px rgba(0,0,0,.25);transform-origin:bottom center}
  .miniq{width:44px;height:44px;margin:0 3px;flex:0 0 44px;border-radius:10px;background:#CDAFB3;color:#3B2328;
         font-family:var(--serif);font-size:30px;line-height:54px;text-align:center}
  .credit{padding:20px 20px 24px;font-size:10.5px;line-height:1.6;color:var(--muted)}

  .seg{display:flex;gap:6px;padding:12px 20px 6px}
  .seg button{flex:1;font:inherit;font-size:13px;padding:8px 0;border-radius:10px;cursor:pointer;
              border:1px solid var(--line);background:var(--soft);color:var(--muted)}
  .seg button.sel{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}

  .mcard{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid var(--line);cursor:pointer}
  .mcard .tx{flex:1;min-width:0}
  .mstack{display:flex;align-items:flex-end;flex:0 0 auto}
  .mstack .cover{width:36px;margin-left:-10px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .mstack .cover:first-child{margin-left:0}
  .mstack .cover .ct{font-size:5.6px}
  .mstack .more{font-size:11px;color:var(--muted);width:24px;text-align:right;padding-bottom:3px}
  .mhead{display:flex;align-items:center;gap:10px}
  .mhead .tx{flex:1}
  .mcard .t{font-family:var(--serif);font-size:16.5px;line-height:1.25}
  .mcard .d{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
  .strip{display:flex;gap:8px;margin-top:13px;align-items:flex-end}
  .strip .cover{flex:1 1 0;min-width:0;max-width:56px}
  .strip .more{flex:0 0 auto;font-size:11.5px;color:var(--muted);padding-bottom:6px;margin-left:2px}

  .gtiles{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:14px 20px 26px}
  .gt{border-radius:14px;background:var(--soft);border:1px solid var(--line);padding:13px 13px 14px;cursor:pointer}
  .gt:active{background:#EBE7DF}
  .stack{position:relative;height:84px;margin-bottom:11px}
  .stack .cover{position:absolute;width:48px;box-shadow:0 2px 6px rgba(0,0,0,.26);transform-origin:bottom center}
  .gt .gn{font-size:13.5px;font-weight:500;line-height:1.3}
  .gt .gc{font-size:11px;color:var(--muted);margin-top:3px}

  .shelfhd{padding:16px 20px 0;font-size:13px;color:var(--muted);line-height:1.5}
  .shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 14px;padding:16px 20px 26px}
  .bk{cursor:pointer}
  .bk .n{font-size:11.5px;margin-top:7px;line-height:1.3;font-weight:500}
  .bk .a{font-size:10.5px;color:var(--muted);margin-top:1px}

  .hero{display:flex;gap:16px;padding:20px 20px 16px;align-items:flex-end}
  .hero .cover{width:112px;flex:0 0 112px;box-shadow:0 6px 16px rgba(0,0,0,.22)}
  .hero .cover .ct{font-size:13.5px}
  .hero .cover .ca{font-size:7.5px}
  .hero h1{font-family:var(--serif);font-size:21px;line-height:1.2;font-weight:600}
  .hero .au{font-size:13px;color:var(--muted);margin-top:5px}
  .pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .pills span{font-size:11px;padding:4px 9px;border-radius:999px;background:var(--soft);
              border:1px solid var(--line);color:#4a463f}
  .cta{margin:0 20px;padding:13px;border-radius:12px;background:var(--accent);color:#fff;
       text-align:center;font-size:15px;font-weight:500;cursor:pointer}
  .cta:active,.solid:active{filter:brightness(.93)}
  .blurb{padding:16px 20px 2px;font-size:13.5px;line-height:1.65;color:#403c36}
  .why{margin:0 20px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);
       font-size:13px;line-height:1.6;color:#234f48}
  .mynote{margin:0 20px;padding:11px 14px;border-left:3px solid var(--accent);background:#F1EEE7;
          border-radius:0 8px 8px 0;font-size:13px;line-height:1.55;color:#413d37}
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px}
  .chip{font-size:12.5px;padding:7px 13px;border-radius:999px;background:var(--accent-soft);
        color:var(--accent);cursor:pointer;border:1px solid #d2e4e0}
  .chip.plain{background:#F1EEE8;color:var(--muted);border-color:var(--line)}
  .alsorow{display:flex;gap:12px;padding:2px 20px 26px;overflow-x:auto;scrollbar-width:none}
  .alsorow::-webkit-scrollbar{height:0}
  .alsorow .bk{flex:0 0 78px}

  .read{padding:24px 26px 30px;font-family:var(--serif);font-size:16.5px;line-height:1.78;color:#262320}
  .read p{margin-bottom:17px}
  .tapme{cursor:pointer;text-decoration:underline dotted #b9b2a4;text-underline-offset:5px}
  .mk{cursor:pointer;background:var(--mark);box-shadow:0 0 0 2px var(--mark);border-radius:2px}
  .anchor{position:relative;height:0;z-index:5}
  .pop{position:absolute;top:-8px;left:-6px;right:-6px;background:#2A2724;color:#fff;border-radius:13px;
       padding:9px;display:flex;gap:7px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-family:var(--sans)}
  .pop::before{content:"";position:absolute;top:-6px;left:34px;width:12px;height:12px;background:#2A2724;transform:rotate(45deg)}
  .pop button{flex:1;font:inherit;font-size:12.5px;color:#fff;background:#3C3835;border:0;
              border-radius:9px;padding:10px 4px;cursor:pointer;position:relative}
  .pop button.go{background:var(--accent);font-weight:500}
  .notep{flex-direction:column;gap:9px;align-items:stretch}
  .notep textarea{width:100%;min-height:76px;border:0;border-radius:9px;padding:9px 10px;position:relative;
                  font-family:var(--sans);font-size:13px;line-height:1.5;resize:none;
                  outline:none;background:#3C3835;color:#fff}
  .notep textarea::placeholder{color:#9c958c}
  .nbtns{display:flex;gap:7px}
  .nerr{font-size:11px;color:#F3A0A2;padding:0 2px;position:relative}
  .noteblk{margin:0 0 17px;padding:11px 14px;border-left:3px solid var(--accent);
           background:#F1EEE7;border-radius:0 8px 8px 0;font-family:var(--sans);
           font-size:12.5px;line-height:1.55;color:#413d37;cursor:pointer}
  .noteblk .nl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .rfoot{flex:0 0 auto;padding:10px 26px 16px;border-top:1px solid var(--line);background:var(--paper)}
  .rfoot .bar{margin-top:0}
  .rfoot div.tx{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px}

  .card{margin:16px 22px 14px;border-radius:16px;padding:26px 24px;min-height:270px;
        display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 12px rgba(0,0,0,.14)}
  .card q{font-family:var(--serif);font-size:17px;line-height:1.6;display:block;quotes:none}
  .body.fit{display:flex;flex-direction:column;overflow:hidden}
  .body.fit .card{flex:1 1 0;min-height:130px;max-height:300px;margin:14px 22px 12px;padding:18px 22px;overflow:hidden}
  .body.fit .ctl{flex:0 0 auto}
  .body.fit .card .src{margin-top:12px}
  .body.fit .card .qm.cl{margin-top:14px}
  .qm{font-family:var(--serif);line-height:.6;display:block;opacity:.55}
  .card .qm{font-size:50px}
  .card .qm.cl{text-align:right;margin-top:20px}
  .card .src{font-size:11px;margin-top:18px;opacity:.78}
  .swatches{display:flex;gap:7px;justify-content:center;padding:5px 22px}
  .sw{flex:1 1 0;min-width:0;max-width:36px;aspect-ratio:1;border-radius:28%;cursor:pointer;
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
  .sw.sel{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--accent)}
  .note{font-size:12px;color:var(--muted);text-align:center;padding:10px 24px 0;line-height:1.5}
  .field{margin:2px 22px 0;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff}
  .field input{border:0;background:transparent;outline:none;font:inherit;font-size:13.5px;width:100%}
  .btnrow{display:flex;gap:10px;padding:12px 22px 16px}
  .btnrow div{flex:1;text-align:center;padding:12px;border-radius:12px;font-size:14px;cursor:pointer}
  .solid{background:var(--accent);color:#fff;font-weight:500}
  .ghost{background:#F1EEE8;border:1px solid var(--line);color:var(--ink);flex:0 0 34% !important}

  .feed{columns:2;column-gap:12px;padding:16px 16px 22px}
  .post{break-inside:avoid;margin-bottom:20px}
  .who{display:flex;align-items:center;gap:7px;padding:0 2px 7px;font-size:11px;color:var(--muted)}
  .who b{color:var(--ink);font-weight:500}
  .av{width:20px;height:20px;border-radius:50%;color:#fff;font-size:9.5px;font-weight:600;
      display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .fc{border-radius:13px;padding:14px 14px 15px;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.12);min-height:118px;
      display:flex;flex-direction:column;justify-content:center}
  .fc q{font-family:var(--serif);font-size:12.5px;line-height:1.52;display:block;quotes:none}
  .fc .qm{font-size:28px}
  .fc .qm.cl{text-align:right;margin-top:10px}
  .acts{display:flex;align-items:center;gap:6px;padding:8px 2px 0;font-size:12px;color:var(--muted)}
  .heart{display:flex;cursor:pointer;padding:2px}
  .heart svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
  .heart.on{color:var(--rose)}
  .heart.on svg{fill:currentColor}
  .cap2{padding:3px 2px 0;font-size:11.5px;color:var(--muted);cursor:pointer;line-height:1.4}
  .cap2 b{color:var(--ink);font-weight:500}
  .cmt{padding:4px 2px 0;font-size:11.5px;line-height:1.45;color:#4a463f}

  .srow{display:flex;gap:13px;align-items:center;padding:11px 20px;border-bottom:1px solid var(--line);cursor:pointer}
  .srow .cover{width:40px;flex:0 0 40px}
  .srow .t{font-size:14px;font-weight:500}
  .srow .a{font-size:12px;color:var(--muted);margin-top:1px}
  .srow .m{font-size:11px;color:var(--accent);margin-top:3px}
  .sugg{margin:14px 20px 0;padding:14px 16px;border-radius:14px;background:var(--accent-soft);cursor:pointer}
  .sugg .q{font-size:12.5px;color:#4d6f69}
  .sugg .a{font-size:15.5px;color:var(--accent);font-weight:500;margin-top:3px}
  .empty{padding:22px 20px 10px;font-size:13.5px;color:var(--muted);line-height:1.6}

  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.3);z-index:7}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);
         border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.16);padding:10px 18px 20px;z-index:8}
  .grab{width:38px;height:4px;border-radius:2px;background:#D9D3C7;margin:0 auto 12px}
  .sheet .sh{font-size:13px;font-weight:500;text-align:center;margin-bottom:16px}
  .targets{display:flex;justify-content:space-around;margin-bottom:16px}
  .tg{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:10.5px;
      color:var(--muted);cursor:pointer;width:70px;text-align:center}
  .tg .ti{width:48px;height:48px;border-radius:15px;background:#EFEBE3;border:1px solid var(--line);
          display:flex;align-items:center;justify-content:center;color:var(--ink)}
  .tg .ti svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;
              stroke-linecap:round;stroke-linejoin:round}
  .cancelsheet{text-align:center;padding:12px;border-radius:12px;background:#F1EEE8;
               border:1px solid var(--line);font-size:14px;cursor:pointer}
  .toast{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;bottom:76px;background:#2A2724;color:#fff;
         font-size:12.5px;padding:9px 15px;border-radius:999px;white-space:nowrap;z-index:9;
         box-shadow:0 6px 18px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div class="phone" id="phone"></div>
<div class="cap">Screen: <b id="cap">Home</b></div>

<script>
const PAL=['#4A5B6E','#7C5A4A','#3F5D52','#6B4F6E','#8A6A3E','#45566B','#5E6B45','#7A4A4A',
           '#4C4A6B','#6E5B3F','#3E5C68','#6B4452','#55614A','#7A5E52','#44556A','#5F4A6B',
           '#6A5340','#4A6358','#75524A','#505A6E','#64553F','#4E6560','#6B4A5E'];
// Each book's "q" is the passage shown on the reading screen and the quote card.
// Replace the text inside "q" with the passage you want. Keep it to a sentence or two.
const B=[
 {"id": 1, "t": "The Little Prince", "a": "Antoine de Saint-Exupéry", "y": 1943, "p": 96, "m": "easy", "g": "selfhelp", "d": "A pilot crashes in the Sahara and meets a boy who has left his own tiny planet, and the rose he loves, behind. Twenty-seven short chapters with the author's own watercolours.", "w": "Chapters run two or three pages and the story circles back on itself, so putting it down costs you nothing.", "q": "Most beautiful things cannot be seen or touched, they are felt with the heart."},
 {"id": 2, "t": "Fierce Fairytales", "a": "Nikita Gill", "y": 2018, "p": 176, "m": "piece", "g": "poetry", "d": "Classic fairy tales retold as poems and short prose, with the author's ink drawings. Villains get histories and the princesses stop waiting to be collected.", "w": "Almost nothing runs longer than a page. You can finish a piece between two stops and still look out the window.", "q": "Some stories only make sense once you stop waiting to be rescued."},
 {"id": 3, "t": "The Courage to Be Disliked", "a": "Kishimi & Koga", "y": 2013, "p": 288, "m": "piece", "g": "selfhelp", "d": "A philosopher and a sceptical young man argue across five nights about Adlerian psychology: separating your tasks from other people's, and living without needing approval.", "w": "Each night is a complete argument, and each one runs about a ride.", "q": "You keep asking how to be free of them. Start by noticing whose problem it actually is."},
 {"id": 4, "t": "Talking to Strangers", "a": "Malcolm Gladwell", "y": 2019, "p": 388, "m": "piece", "g": "nonfic", "d": "Why we misread people we do not know, built from cases: a traffic stop in Texas, a spy inside the Pentagon, a financier nobody questioned for decades.", "w": "Every case opens and closes inside its own chapter, so an interruption never costs you the thread.", "q": "We are confident reading strangers and terrible at it, and the gap never seems to narrow."},
 {"id": 5, "t": "Who Moved My Cheese?", "a": "Spencer Johnson", "y": 1998, "p": 96, "m": "piece", "g": "selfhelp", "d": "Two mice and two small people search a maze for cheese, framed by a conversation among old classmates. A parable about how differently people meet a change they did not choose.", "w": "Ninety-six pages. One ride there, one ride back, and you are done.", "q": "Movement in a new direction helps you find new cheese."},
 {"id": 6, "t": "Harry Potter and the Prisoner of Azkaban", "a": "J. K. Rowling", "y": 1999, "p": 435, "m": "easy", "g": "fantasy", "d": "Third year at Hogwarts. A prisoner escapes, a map shows every corridor in the castle, and the story turns out to have been running backwards.", "w": "You have read it before, which means you can rejoin it at any paragraph without paying for the gap.", "q": "The castle kept more secrets than anyone had thought to ask it for."},
 {"id": 7, "t": "Confessions", "a": "Kanae Minato", "y": 2008, "p": 240, "m": "clear", "g": "mystery", "d": "A teacher tells her class that two of them killed her daughter, and then walks out. The story is retold six times in six voices, each revising the one before it.", "w": "Six narrators who contradict each other. Lose the thread and you lose the book.", "q": "Everyone in the room agreed on the facts. No two of them agreed on the story."},
 {"id": 8, "t": "Kim Ji-young, Born 1982", "a": "Cho Nam-joo", "y": 2016, "p": 176, "m": "piece", "g": "nonfic", "d": "A Korean woman's life from birth to motherhood, told in flat, documentary chapters with footnotes citing real statistics. It reads less like a novel than a case file.", "w": "Chapters are short life stages, and the footnotes give you a natural place to stop.", "q": "Nothing in the file was unusual. That was the finding."},
 {"id": 9, "t": "Gone Girl", "a": "Gillian Flynn", "y": 2012, "p": 415, "m": "clear", "g": "mystery", "d": "A wife disappears on her fifth wedding anniversary. Her diary and her husband's account of the same marriage pull steadily in opposite directions.", "w": "The book is built out of what each narrator leaves out, so you have to hold both versions at once.", "q": "Nobody tells a story about themselves without editing it first."},
 {"id": 10, "t": "Before I Go to Sleep", "a": "S. J. Watson", "y": 2011, "p": 368, "m": "clear", "g": "mystery", "d": "Christine wakes each morning with no memory of the last twenty years, and reads a journal she does not remember writing, in handwriting she does not recognise.", "w": "The plot is a memory test. Reading it in interrupted pieces works against you.", "q": "She read her own handwriting the way you read a stranger's letter."},
 {"id": 11, "t": "Sophie's World", "a": "Jostein Gaarder", "y": 1991, "p": 518, "m": "miss", "g": "fiction", "d": "A fourteen-year-old starts receiving letters asking who she is and where the world came from. The novel turns into a course in Western philosophy, and then turns again.", "w": "A textbook wearing a novel's coat, and it keeps pulling the coat open just as your stop arrives.", "q": "The question was not hard. It was only one nobody had asked her before."},
 {"id": 12, "t": "The Solitude of Prime Numbers", "a": "Paolo Giordano", "y": 2008, "p": 271, "m": "clear", "g": "literary", "d": "Alice and Mattia meet as damaged teenagers and orbit each other across decades, close enough to see one another and never close enough to touch.", "w": "Quiet and slow, and built almost entirely out of what the two of them do not say.", "q": "Two people can stand next to each other for years and never quite touch."},
 {"id": 13, "t": "The Surgeon", "a": "Tess Gerritsen", "y": 2001, "p": 352, "m": "clear", "g": "mystery", "d": "A Boston detective hunts a killer who is copying a murderer everyone believed was dead. The first of the Rizzoli and Isles novels.", "w": "A procedural you follow clue by clue, and the pages you are on are not ones you want a seatmate reading.", "q": "The pattern was old. Somebody had taken the trouble to learn it."},
 {"id": 14, "t": "My Sister's Keeper", "a": "Jodi Picoult", "y": 2004, "p": 423, "m": "miss", "g": "mystery", "d": "Anna was conceived to be a bone marrow match for her older sister. At thirteen she sues her parents for the rights to her own body. Told by nearly everyone in the family.", "w": "You will not want to get off the train, and you may not want anyone watching your face.", "q": "She had been useful before she had been anything else."},
 {"id": 16, "t": "Thinking, Fast and Slow", "a": "Daniel Kahneman", "y": 2011, "p": 499, "m": "clear", "g": "selfhelp", "d": "Two systems of thinking, one fast and one effortful, and the biases that follow from relying on the wrong one. Thirty-eight chapters drawn from decades of work with Amos Tversky.", "w": "The puzzles only teach you anything if you actually stop and attempt them, which takes a clear head.", "q": "You answered before you noticed you had been asked something else."},
 {"id": 17, "t": "The Catcher in the Rye", "a": "J. D. Salinger", "y": 1951, "p": 277, "m": "piece", "g": "literary", "d": "Three days in New York after Holden Caulfield is thrown out of school again, told in one continuous voice across twenty-six chapters.", "w": "Episodic. Each chapter is one encounter, and the voice picks straight back up wherever you left it.", "q": "He talks the entire way home and manages to say almost nothing."},
 {"id": 18, "t": "The Help", "a": "Kathryn Stockett", "y": 2009, "p": 544, "m": "miss", "g": "literary", "d": "Jackson, Mississippi, 1962. Two Black maids and a young white writer secretly collect accounts of domestic work, at considerable risk to all three. Three narrators in turn.", "w": "Long, but the voices carry you, and they carry you past your stop.", "q": "They had been in the house for thirty years and nobody had asked them anything."},
 {"id": 19, "t": "The Wedding People", "a": "Alison Espach", "y": 2024, "p": 384, "m": "easy", "g": "literary", "d": "A woman checks into a grand Rhode Island hotel alone, with one intention, and finds the whole place booked out for a stranger's wedding week.", "w": "Warm and funny, and forgiving if you drift off somewhere around the rehearsal dinner.", "q": "She had come here to be alone, which turned out to require a reservation."},
 {"id": 20, "t": "Where Rainbows End", "a": "Cecelia Ahern", "y": 2004, "p": 420, "m": "easy", "g": "romance", "d": "Rosie and Alex grow up together and apart across fifty years, told entirely in letters, emails, notes passed in class and instant messages.", "w": "Every entry is a few lines long. You can stop between any two of them and lose nothing.", "q": "Everything that mattered got said in the margins."},
 {"id": 21, "t": "The Kite Runner", "a": "Khaled Hosseini", "y": 2003, "p": 371, "m": "miss", "g": "literary", "d": "Amir betrays his friend Hassan in Kabul in 1975, and returns decades later from California to a country he no longer recognises.", "w": "It takes you somewhere and is in no hurry to give you back.", "q": "He was still standing in that alley, thirty years and six thousand miles later."},
 {"id": 22, "t": "The Five People You Meet in Heaven", "a": "Mitch Albom", "y": 2003, "p": 196, "m": "miss", "g": "fiction", "d": "Eddie dies at eighty-three repairing a ride at a seaside amusement park, and meets five people who explain to him what his life had been for.", "w": "Five encounters, each one landing harder than the last. Short, and not safe among strangers.", "q": "Every life touches five others, and not one of them is the five you would have guessed."},
 {"id": 26, "t": "Th1rt3en", "a": "Steve Cavanagh", "y": 2018, "p": 357, "m": "clear", "g": "mystery", "d": "Eddie Flynn defends a film star accused of killing his wife, while the real murderer sits on the jury. The lawyer and the killer narrate in turn.", "w": "You know what the jury does not, and holding both sides of that is the whole pleasure.", "q": "Twelve of them were there to decide. The thirteenth was there to watch it work."},
 {"id": 29, "t": "Writing to Heal the Soul", "a": "Susan Zimmermann", "y": 2002, "p": 192, "m": "piece", "g": "selfhelp", "d": "A guide to writing through grief, by a mother whose first child developed a neurological disorder. Short chapters, each ending in a prompt to try yourself.", "w": "It is made of prompts. Open it anywhere, do one, close it before your stop.", "q": "Write the part you have been going around. Go slowly, and stay there."}];

function tabs(sel){return '<div class="tabs">'+
  [['home','Home','home'],['browse','Browse','browse'],['feed','Feed','feed'],['liked','Liked','heart']]
  .map(([k,l,i])=>`<div class="tab ${sel===k?'sel':''}" onclick="tap('${k}')"><svg viewBox="0 0 24 24">${ic[i]}</svg>${l}</div>`).join('')+'</div>'}
function nav(title,backJs,backLabel){return `<div class="nav"><span class="back" onclick="${backJs}">‹ ${backLabel||'Back'}</span><h2>${title}</h2></div>`}
function avatar(u){const cs=['#7C5A4A','#45566B','#5E6B45','#6B4F6E','#8A6A3E','#3E5C68','#6B4452'];
  let h=0;for(const ch of u)h=(h*31+ch.charCodeAt(0))%997;
  return `<span class="av" style="background:${u==='you'?'var(--accent)':cs[h%cs.length]}">${u[0].toUpperCase()}</span>`}

/* ---------- navigation ---------- */
function go(s,push){ if(push!==false&&cur!==s)hist.push(cur); cur=s; toastMsg=''; shareOpen=false; noteMode=false; render(s==='search'); }
function back(){ toastMsg=''; shareOpen=false; noteMode=false; cur=hist.pop()||'home'; restore=true; render(); }
function tap(k){ hist=[]; if(k==='home')go('home',false); if(k==='browse')go('browse',false);
  if(k==='feed'){feedTab='all';go('feed',false);} if(k==='liked'){feedTab='liked';go('feed',false);} }
function detail(id){ bookId=id; go('detail'); }
function openShelf(kind,key){ shelfKind=kind; shelfKey=key; go('shelf'); }
function startRead(id){ bookId=id; lastRead=id; if(!progress[id])progress[id]=1; readSel=false; go('read'); }

/* ---------- actions ---------- */
function toast(m){ toastMsg=m; render(); clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{toastMsg='';const e=document.querySelector('.toast');if(e)e.remove();},1900); }
function like(pid){ liked.has(pid)?liked.delete(pid):liked.add(pid); render(); }
function openNote(){ noteMode=true; noteErr=false; render(); const f=document.getElementById('nt'); if(f)f.focus(); }
function cancelNote(){ noteMode=false; noteErr=false; render(); }
function saveNote(){
  const el=document.getElementById('nt'), v=(el?el.value:'').trim();
  if(!v){ noteErr=true; render(); const f=document.getElementById('nt'); if(f)f.focus(); return; }
  notes[bookId]=v; noteMode=false; noteErr=false; readSel=false; toast('Note saved');
}
function share(open){ shareOpen=open; render(); }
function shareTo(){ shareOpen=false; toast('Prototype only: nothing was sent'); }
function postCard(){
  myPosts.unshift({pid:'me'+Date.now(),u:'you',t:'just now',id:bookId,l:0,bg:bgi,c:comment.trim(),own:true});
  comment=''; step='bg'; readSel=false; feedTab='all'; hist=[]; cur='feed'; toast('Posted to the feed');
}

   <div class="cancelsheet" onclick="share(false)">Cancel</div></div>`; }

/* ---------- search: real matches first, then the nearest title if the query is close ---------- */
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];}
  for(let j=1;j<=b.length;j++){m[0][j]=j;}
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
    m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return m[a.length][b.length];}
function nearest(q){ let best=null,score=1;
  const strip=s=>s.toLowerCase().replace(/^the\s+/,'').replace(/[^a-z0-9 ]/g,'');
  for(const b of B){ const t=strip(b.t), qq=strip(q);
    const s=Math.min(lev(qq,t)/Math.max(qq.length,t.length), lev(qq,t.slice(0,qq.length))/Math.max(qq.length,1)+.08);
    if(s<score){score=s;best=b;} }
  return score<=.34?best:null; }

   : '<div class="gtiles">'+GEN.map(g=>{const ls=B.filter(b=>b.g===g.k),rot=[-9,0,9],top=[7,0,7],z=[1,3,2];
       return `<div class="gt" onclick="openShelf('genre','${g.k}')">
         <div class="stack">${ls.slice(0,3).map((b,j)=>`<div class="cover s" style="background:${b.c};left:${6+j*26}px;top:${top[j]}px;transform:rotate(${ls.length===1?0:rot[j]}deg);z-index:${z[j]}"><span class="ct">${(ls.length===1?j===0:j===1)?b.t:''}</span></div>`).join('')}</div>
         <div class="gn">${g.n}</div><div class="gc">${ls.length} book${ls.length>1?'s':''}</div></div>`}).join('')+'</div>';
  return status()+`<div class="nav"><h2 style="padding:0">Browse</h2></div>
   <div class="body"><div class="seg">
    <button class="${browseTab==='mood'?'sel':''}" onclick="browseTab='mood';render()">Commuting Mood</button>
    <button class="${browseTab==='genre'?'sel':''}" onclick="browseTab='genre';render()">Genre</button></div>
    ${rows}</div>`+tabs('browse');
 },
 shelf(){
  const list = shelfKind==='mood' ? B.filter(b=>b.m===shelfKey) : B.filter(b=>b.g===shelfKey);
  const meta = shelfKind==='mood' ? MOOD.find(m=>m.k===shelfKey) : GEN.find(g=>g.k===shelfKey);
  return status()+nav(meta.n,"back()")+`<div class="body">
   <div class="shelfhd">${meta.d?meta.d+' · ':''}${list.length} book${list.length>1?'s':''}</div>
   <div class="shelf">${list.map(tile).join('')}</div></div>`+tabs('browse');
 },
 detail(){
  const b=book(bookId), m=MOOD.find(x=>x.k===b.m), g=GEN.find(x=>x.k===b.g);
  const also=B.filter(x=>x.m===b.m&&x.id!==b.id).slice(0,5);
  return status()+nav(b.t,"back()")+`<div class="body">
   <div class="hero">${cover(b)}<div><h1>${b.t}</h1><div class="au">${b.a}</div>
     <div class="pills"><span>${b.y}</span><span>${b.p} pages</span><span>about ${rides(b.p)} of 30 min</span></div></div></div>
   <div class="cta" onclick="startRead(${b.id})">${progress[b.id]?'Continue reading':'Start reading'}</div>
   <div class="blurb">${b.d}</div>
   <div class="lbl">Why it's in ${m.n.toLowerCase()}</div>
   <div class="why">${b.w}</div>
   ${notes[b.id]?`<div class="lbl">Your note</div><div class="mynote">${esc(notes[b.id])}</div>`:''}
   <div class="lbl">Where it sits</div>
   <div class="chips"><span class="chip" onclick="openShelf('mood','${b.m}')">${m.n}</span>
     <span class="chip plain" onclick="openShelf('genre','${b.g}')">${g.n}</span></div>
   <div class="lbl">More in ${m.n.toLowerCase()}</div>
   <div class="alsorow">${also.map(x=>`<div class="bk" onclick="detail(${x.id})">${cover(x,true)}<div class="n">${x.t}</div></div>`).join('')}</div></div>`+tabs('browse');
 },
 read(){
  const b=book(bookId), pg=progress[b.id]||1, marked=readSel||notes[bookId];
  const hint=noteMode?'Writing a note':readSel?'Passage selected':notes[bookId]?'Highlighted, with a note':'Tap the underlined passage';
  return status()+nav(b.t,"back()")+`<div class="body">
   <div class="read">
     <p>He had been walking since morning and had not yet decided what he was looking for, which is the only honest way to look for anything.</p>
     <p><span class="${marked?'mk':'tapme'}" onclick="readSel=true;noteMode=false;render()">${b.q}</span></p>
     <div class="anchor">${readSel&&!noteMode?`<div class="pop"><button onclick="readSel=false;render()">Cancel</button><button onclick="openNote()">Note</button><button class="go" onclick="step='bg';go('compose')">Quote card</button></div>`:''}
     ${noteMode?`<div class="pop notep">
       <textarea id="nt" oninput="noteErr=false;var e=document.querySelector('.nerr');if(e)e.remove();" placeholder="Why did this one stay with you?">${esc(notes[bookId]||'')}</textarea>
       ${noteErr?'<div class="nerr">Write something first, or cancel.</div>':''}
       <div class="nbtns"><button onclick="cancelNote()">Cancel</button><button class="go" onclick="saveNote()">Save note</button></div></div>`:''}</div>
     ${notes[bookId]&&!noteMode?`<div class="noteblk" onclick="openNote()"><div class="nl">Your note · tap to edit</div>${esc(notes[bookId])}</div>`:''}
     <p>The road went on past the last of the houses, and he went on with it, counting nothing.</p>
     <p>By the time the light changed he had stopped expecting an answer, and that, he thought later, was about when one arrived.</p>
   </div></div>
   <div class="rfoot"><div class="bar"><i style="width:${Math.max(3,Math.round(pg/b.p*100))}%"></i></div>
     <div class="tx"><span>Page ${pg} of ${b.p}</span><span>${hint}</span></div></div>`;
 },
 compose(){
  const b=book(bookId), c=BG[bgi];
  const card=`<div class="card" style="background:${c.css};color:${c.f};${c.ts}"><span class="qm">“</span><q>${b.q}</q><span class="qm cl">”</span><div class="src">${b.t} · ${b.a}</div></div>`;
  if(step==='bg') return status()+nav("Choose a background","back()")+`<div class="body fit">${card}
    <div class="ctl"><div class="swatches">${BG.map((x,i)=>`<div class="sw ${i===bgi?'sel':''}" style="background:${x.css}" onclick="bgi=${i};render()" aria-label="${x.n}"></div>`).join('')}</div>
    <div class="note">${c.n}${c.by?` · photo by ${c.by}`:''}</div>
    <div class="btnrow"><div class="solid" onclick="step='draft';render()">Confirm</div></div></div></div>`;
  return status()+nav("Add a comment","step='bg';render()")+`<div class="body fit">${card}
    <div class="ctl"><div class="field"><input id="cm" placeholder="Say something about it (optional)" value="${esc(comment)}" oninput="comment=this.value" maxlength="90"></div>
    <div class="note" style="font-size:11px;padding-top:8px">The card carries the title and author. Passages are quoted for study; rights remain with their authors and publishers.</div>
    <div class="btnrow"><div class="ghost" onclick="share(true)">Share</div>
      <div class="solid" onclick="postCard()">Post to the feed</div></div></div></div>`+sheet();
 },
 feed(){
  const items=[...myPosts,...OTHERS].filter(o=>feedTab==='all'||liked.has(o.pid));
  const head=`<div class="nav"><h2 style="padding:0">${feedTab==='all'?'Quote feed':'Liked'}</h2></div>`;
  if(!items.length) return status()+head+`<div class="body"><div class="empty">Nothing liked yet. Tap the heart under any card in the feed and it will wait for you here.</div>
    <div class="chips" style="padding-top:6px"><span class="chip" onclick="tap('feed')">Go to the feed</span></div></div>`+tabs('liked');
  const cards=items.map(o=>{
    const b=book(o.id), bg=BG[o.bg], on=liked.has(o.pid), n=o.l+(on?1:0);
    return `<div class="post">
      <div class="who">${avatar(o.u)}<span><b>${o.u}</b> · ${o.t}</span></div>
      <div class="fc" style="background:${bg.css};color:${bg.f};${bg.ts}" onclick="detail(${b.id})">
        <span class="qm">“</span><q>${b.q}</q><span class="qm cl">”</span></div>
      <div class="acts"><span class="heart ${on?'on':''}" onclick="like('${o.pid}')" aria-label="${on?'Unlike':'Like'}" aria-pressed="${on}"><svg viewBox="0 0 24 24">${ic.heart}</svg></span>${n}</div>
      <div class="cap2" onclick="detail(${b.id})"><b>${b.t}</b><br>${b.a}</div>
      ${o.c?`<div class="cmt">${esc(o.c)}</div>`:''}</div>`;});
  return status()+head+`<div class="body"><div class="feed">${cards.join('')}</div></div>`+tabs(feedTab==='all'?'feed':'liked');
 },
 search(){
  const q=searchQ.trim().toLowerCase();
  const hits=q?B.filter(b=>b.t.toLowerCase().includes(q)||b.a.toLowerCase().includes(q)):[];
  const moods=`<div class="chips" style="padding-top:4px">${MOOD.map(m=>`<span class="chip" onclick="openShelf('mood','${m.k}')">${m.n}</span>`).join('')}</div>`;
  let inner;
  if(!q){
   inner=`<div class="empty">Search by title or author, or start from a Commuting Mood.</div>${moods}`;
  } else if(hits.length){
   inner=`<div class="lbl" style="padding-top:16px">${hits.length} in your library</div>`+hits.map(b=>
     `<div class="srow" onclick="detail(${b.id})">${cover(b,true)}<div><div class="t">${b.t}</div><div class="a">${b.a}</div><div class="m">${MOOD.find(m=>m.k===b.m).n}</div></div></div>`).join('');
  } else {
   const near=nearest(q);
   inner=(near?`<div class="sugg" onclick="detail(${near.id})"><div class="q">No results for “${esc(searchQ.trim())}”</div>
       <div class="a">Did you mean ${near.t}?</div></div>`
     :`<div class="empty" style="padding-bottom:0;color:var(--ink)">No results for “${esc(searchQ.trim())}”</div>`)
     +`<div class="empty">Try fewer words, or pick a Commuting Mood.</div>${moods}`;
  }
  return status()+nav("Search","go('home',false)","Home")+`
   <div class="search">${sIcon}<input id="q" placeholder="Try: the little princess" value="${esc(searchQ)}" oninput="searchQ=this.value;render(true)" autocomplete="off">${searchQ?`<span class="clear" onclick="searchQ='';render(true)">Clear</span>`:''}</div>
   <div class="body">${inner}</div>`;
 }
};

/* ---------- render ---------- */
const NAMES={home:"Home",browse:"Browse",shelf:"Shelf",detail:"Book detail",read:"Reading",
             compose:"Quote card",feed:"Quote feed",search:"Search"};
function key(){ return cur+'|'+({browse:browseTab,shelf:shelfKind+shelfKey,detail:bookId,read:bookId,feed:feedTab,compose:step}[cur]||''); }
function render(keepFocus){
  const ph=document.getElementById('phone'), ob=ph.querySelector('.body');
  if(ob) scrollMemo[lastKey]=ob.scrollTop;
  const k=key(), same=k===lastKey;
  ph.innerHTML=`<div class="screen ${same?'':'enter'}">${V[cur]()}${toastMsg?`<div class="toast">${toastMsg}</div>`:''}</div>`;
  const nb=ph.querySelector('.body');
  if(nb&&(same||restore)) nb.scrollTop=scrollMemo[k]||0;
  restore=false; lastKey=k; fitCard();
  ph.querySelectorAll('[onclick]').forEach(el=>{ if(!/^(BUTTON|INPUT|TEXTAREA)$/.test(el.tagName)){el.setAttribute('role','button');el.tabIndex=0;} });
  let n=NAMES[cur];
  if(cur==='read') n+=noteMode?" · note":readSel?" · passage selected":" · plain";
  if(cur==='compose') n+=shareOpen?" · share sheet":step==='bg'?" · background":" · comment";
  if(cur==='browse') n+=browseTab==='mood'?" · Commuting Mood":" · Genre";
  if(cur==='feed') n=feedTab==='all'?"Quote feed":"Liked";
  if(cur==='search'){const q=searchQ.trim().toLowerCase();
    n+=!q?" · empty":B.some(b=>b.t.toLowerCase().includes(q)||b.a.toLowerCase().includes(q))?" · results":nearest(q)?" · did you mean":" · no results";}
  document.getElementById('cap').textContent=n;
  if(keepFocus){const i=document.getElementById('q');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}}
}
function fitCard(){ const c=document.querySelector('.body.fit .card'); if(!c) return;
  const q=c.querySelector('q'), ms=c.querySelectorAll('.qm'); let s=17;
  const set=()=>{ q.style.fontSize=s+'px'; ms.forEach(m=>m.style.fontSize=Math.round(s*2.9)+'px'); };
  set(); while(c.scrollHeight>c.clientHeight+1 && s>11){ s-=.5; set(); } }
window.addEventListener('resize',fitCard);
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('role')==='button'){e.preventDefault();e.target.click();}
  if(e.key==='Escape'){ if(shareOpen)share(false); else if(noteMode)cancelNote(); else if(readSel&&cur==='read'){readSel=false;render();} }
});
render();
</script>
</body>
</html>
